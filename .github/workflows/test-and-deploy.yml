name: Test and deploy

# push covers same-repo branches; pull_request exists for forks, so the jobs skip same-repo PR events
# to avoid running everything twice.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint, formatting and an up-to-date symbol index
        run: npm run ci-checks
      - name: Unit tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A later deploy waits rather than racing, so an older commit can't finish last.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Check for credentials
        id: credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No AWS credentials are configured, so dist/ was built but not deployed."
          fi
      - name: Deploy to S3
        if: steps.credentials.outputs.present == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        # Only meta/ is ours on bbc.xania.org; jsbeeb deploys the rest. The sets go up before the index that
        # names them, and nothing is deleted, so a client holding an older index can still fetch its sets.
        run: |
          aws s3 sync dist/meta s3://bbc.xania.org/meta --no-progress --cache-control max-age=300 \
            --exclude "symbols/index.json"
          aws s3 cp dist/meta/symbols/index.json s3://bbc.xania.org/meta/symbols/index.json \
            --no-progress --cache-control max-age=300
